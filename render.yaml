services:
  - type: web
    name: pharmacie-de-paris
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false   # à renseigner manuellement dans le dashboard Render
